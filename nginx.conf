server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  location ~* \.(webp|ttf|m4a|mp3|png|jpg)$ { expires 7d; add_header Cache-Control "public"; }
  location ~* \.(js|html)$ { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
